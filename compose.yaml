name: clothes-business-system

services:
  web:
    image: ${DOCKERHUB_USERNAME:-zohaibhassan1368}/clothes-business-system:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      SERVE_WEB: "true"
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/clothing_assistant_db
      ML_SERVICE_URL: http://ml:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker}
    ports:
      - "127.0.0.1:${DOCKER_WEB_PORT:-8080}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_healthy

  ml:
    image: ${DOCKERHUB_USERNAME:-zohaibhassan1368}/clothes-business-system:ml
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      MONGO_URI: mongodb://mongo:27017/clothing_assistant_db
      DB_NAME: clothing_assistant_db
    volumes:
      - ml-models:/app/ml/models/saved
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  ml-models:

